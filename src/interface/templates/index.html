<!DOCTYPE html>
<html>
<head>
    <title>Gerenciador de Câmeras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<div class="container py-4">

    <h2 class="mb-4">Adicionar Nova Câmera</h2>
    <form action="/add_camera" method="post" class="row g-3 mb-5">
        <div class="col-md-5">
            <input type="text" class="form-control" name="cam_id" placeholder="ID da Câmera" required>
        </div>
        <div class="col-md-5">
            <input type="text" class="form-control" name="rtsp_url" placeholder="RTSP URL" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Adicionar</button>
        </div>
    </form>

    <div class="card p-4 mb-4 shadow-sm">
        <h4 class="mb-3">Cadastrar Nova Placa</h4>
        
        <form action="/register_plate" method="post" class="row g-3 align-items-center">
            <div class="col-md-9">
                <input type="text" class="form-control form-control-lg" name="plate" placeholder="Digite a placa (ex: ABC1234)" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-success btn-lg w-100">Cadastrar</button>
            </div>
        </form>

        <hr class="my-4">

        <div>
            <h5 class="mb-3">Placas Cadastradas</h5>
            <ul class="list-inline">
                {% for plate in registered_plates %} 
                <li class="list-inline-item text-center mb-3 me-3">
                    <div class="d-flex flex-column align-items-center p-2 border rounded shadow-sm bg-light">
                        <span class="badge bg-primary fs-4 mb-2">{{ plate }}</span>
                        <a href="/remove_plate/{{ plate }}" class="btn btn-sm btn-outline-danger">Remover</a>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <hr>

    <h2 class="mb-4">Câmeras Ativas</h2>
    <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 g-4">
        {% for cam_id in cameras %}
        <div class="col d-flex align-items-strectch">
            <div class="card shadow-sm w-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">{{ cam_id }}</h5>
                    <a href="/remove_camera/{{ cam_id }}" class="btn btn-sm btn-outline-danger">Remover</a>
                </div>
                <div class="card-body p-0">
                    <img src="/video/{{ cam_id }}" class="img-fluid" alt="Stream da câmera">
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <hr>

    <h2 class="mb-3">Últimas Placas Detectadas</h2>
    <div class="card p-3">
        <div class="row text-center fw-bold mb-2">
            <div class="col-md-4">Câmera</div>
            <div class="col-md-4">Placa</div>
            <div class="col-md-4">Data/Horário</div>
        </div>
        <div id="placa-historico">
            <p>Carregando...</p>
        </div>
    </div>


</div>

<script>
function atualizarHistorico() {
    fetch('/api/ultimas_placas')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('placa-historico');
            if (data.length === 0) {
                container.innerHTML = '<p>Nenhuma placa detectada.</p>';
                return;
            }

            let html = `
                <div class="row text-center fw-bold mb-2">
                    <div class="col-md-3">Câmera</div>
                    <div class="col-md-3">Placa</div>
                    <div class="col-md-3">Data/Horário</div>
                    <div class="col-md-3">Status</div>
                </div>
                <ul class="list-group">
            `;

            data.forEach(entry => {
                const camera_id = entry[1];
                const plate = entry[0];
                const timestamp = entry[2];
                const isRegistered = entry[3]; // 1 = cadastrada, 0 = não

                html += `
                    <li class="list-group-item">
                        <div class="row text-center">
                            <div class="col-md-3"><strong>${camera_id}</strong></div>
                            <div class="col-md-3 text-primary"><strong>${plate}</strong></div>
                            <div class="col-md-3 text-muted">${timestamp}</div>
                            <div class="col-md-3">
                                <span class="badge ${isRegistered ? 'bg-success' : 'bg-danger'}">
                                    ${isRegistered ? 'Cadastrada' : 'Não cadastrada'}
                                </span>
                            </div>
                        </div>
                    </li>`;
            });

            html += '</ul>';
            container.innerHTML = html;
        })
        .catch(error => {
            console.error('Erro ao buscar histórico:', error);
        });
}

atualizarHistorico();
setInterval(atualizarHistorico, 1000); // ou outro intervalo confortável
</script>

</body>
</html>
